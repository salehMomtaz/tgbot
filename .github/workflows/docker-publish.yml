name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Triggers when code is pushed to the 'main' branch
    tags:
      - 'v*'  # Triggers when a new version tag is created (e.g., v1.0.0)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository code to the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up QEMU (enables multi-platform building, like arm64 + amd64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Set up Docker Buildx for optimization and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Log into Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Extract metadata (tags, labels) automatically
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tgbot
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha

      # Step 6: Compile the Dockerfile and push to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
