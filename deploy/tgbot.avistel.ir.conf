# deploy/tgbot.avistel.ir.conf — nginx reverse proxy for https://tgbot.avistel.ir
# Installed by ./install.sh into /etc/nginx/sites-available/ + sites-enabled.
# Requires wildcard cert for avistel.ir (*.avistel.ir) from certbot at /etc/letsencrypt/live/avistel.ir/
#
# FastAPI (Uvicorn) listens on 127.0.0.1:8080 plain HTTP; nginx terminates TLS.
server {
    listen 80;
    server_name tgbot.avistel.ir;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name tgbot.avistel.ir;

    ssl_certificate /etc/letsencrypt/live/avistel.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avistel.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/tgbot.avistel.ir.access.log;
    error_log  /var/log/nginx/tgbot.avistel.ir.error.log;

    client_max_body_size 100M;

    # WebApp & API — proxy everything to FastAPI
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
