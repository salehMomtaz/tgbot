# deploy/tgbot.southpark.ir.conf — nginx reverse proxy for https://tgbot.southpark.ir (reference)
# Current VPS uses direct TLS on :8080 via certs/fullchain.pem (copied from /etc/letsencrypt/live/southpark.ir/),
# so this nginx vhost is NOT enabled by install.sh by default (direct TLS is primary).
# If you prefer nginx termination, copy this to /etc/nginx/sites-available/ and enable.
# Requires wildcard cert for southpark.ir (*.southpark.ir) at /etc/letsencrypt/live/southpark.ir/
server {
    listen 80;
    server_name tgbot.southpark.ir;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host:8080$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name tgbot.southpark.ir;
    ssl_certificate /etc/letsencrypt/live/southpark.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/southpark.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!MD5:!DES:!RC4:!ADH:!SSLv3:!EXP:!PSK:!DSS;
    access_log /var/log/nginx/tgbot.southpark.ir.access.log;
    error_log /var/log/nginx/tgbot.southpark.ir.error.log;
    client_max_body_size 100M;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
